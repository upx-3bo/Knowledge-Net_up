.stat{color:#8ba3c7;font-size:13px}
.boardrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.boardbtn{background:#1b2b44;border:1px solid #2c4266;color:#c7d9f5;border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer}
.boardbtn.active{background:#2563eb;border-color:#3b82f6;color:#fff}
.boardbtn .n{color:#7dd3fc;margin-left:3px;font-weight:600}
details.node{margin-left:18px;border-left:1px solid #26324a;padding-left:14px;margin-top:4px}
details.top{margin-left:0;margin-top:12px;border-left-color:#3b5a86}
summary{cursor:pointer;padding:3px 0;color:#dbe7f7;list-style:none;position:relative}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';position:absolute;left:-14px;color:#4a6488;transition:transform .15s;font-size:12px}
details[open]>summary::before{content:'▾'}
.cnt{color:#5f7ba0;font-size:12px;margin-left:8px;font-weight:normal}
.fcnt{color:#5f7ba0;font-size:12px;margin:3px 0 2px;padding-left:4px}
.file{display:flex;flex-direction:column;padding:4px 6px;border-radius:4px;transition:background .12s}
.file:hover{background:#1c2740}
.file .row1{display:flex;align-items:center;gap:8px}
.icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.fname2{flex:1;color:#c3d2e8;font-size:13px;word-break:break-all}
.size{color:#5f7ba0;font-size:12px;white-space:nowrap;flex-shrink:0}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;padding-left:26px}
.tagchip{font-size:11px;padding:1px 8px;border-radius:10px;background:#1b2b44;border:1px solid #2c4266;color:#c7d9f5}
.tagchip b{color:#7dd3fc;font-weight:600;margin-right:3px}
.tagchip .val{color:#e2eefb}
.hidden{display:none !important}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.show{display:flex}

</div>

"角模块"], "tech": ["智能角模块i-Corner", "角模块智能行驶机器人"]}, "轮胎技术": {"theme": ["轮胎"], "tech": ["UUHP夏季轮胎", "智能轮胎传感器"]}, "其他/待定": {"theme": ["制动系统", "悬架", "技术总览", "技术洞察精选", "整车热管理", "电磁离合器", "轮胎"], "tech": ["创新技术动态综述", "整车热管理系统控制策略", "智能车技术", "智能轮胎传感器", "混合全主动悬架", "湿式制动器(问题清单)", "直磁型电子离合器"]}, "跨域特性": {"theme": ["NVH", "防晕控制", "防晕车"], "tech": ["多模态防晕识别(洞察)", "头枕防晕音响", "整车NVH快速开发(HME)", "智能座舱防晕(多模态)", "防晕车音响(洞察)"]}};   // {板块: {theme:[...], tech:[...]}} 可选池（预设+已填）

let labels = {};      // 用户修正（覆盖预设）
let currentBoard = ''; // 板块筛选
let currentKey = null;

function load(){ try{ labels = JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}; }catch(e){ labels={}; } mergeUserOptions(); }
// 把用户 localStorage 里已填的主题/技术点并入选项池（保证新保存的值立即可选）
function mergeUserOptions(){
  for(const k in labels){
    const v = labels[k]||{}; const b = v.board;
    if(!b) continue;
    const o = OPTIONS[b] || (OPTIONS[b]={theme:[],tech:[]});
    if(v.theme && !o.theme.includes(v.theme)) o.theme.push(String(v.theme).trim());
    String(v.tech||'').split(/[，,]/).forEach(t=>{ t=t.trim(); if(t && !o.tech.includes(t)) o.tech.push(t); });
  }
  for(const b in OPTIONS){ OPTIONS[b].theme.sort(); OPTIONS[b].tech.sort(); }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(labels)); }
function fileKey(path, name){ return path.concat([name]).join(' / '); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lbFor(node, path){
  const k = fileKey(path, node.name);
  const usr = labels[k] || {};
  // 合并：用户字段 > 预设（board/theme/tech/org/site 来自预填）
  return {
    key: k,
    board: usr.board != null ? usr.board : (node.board || ''),
    theme: usr.theme != null ? usr.theme : (node.theme || ''),
    tech: usr.tech != null ? usr.tech : (node.tech || ''),
    org: usr.org != null ? usr.org : (node.org || ''),
    site: usr.site != null ? usr.site : (node.site || ''),
    phone: usr.phone != null ? usr.phone : (node.phone || ''),
    note: usr.note != null ? usr.note : (node.note || ''),
    corrected: !!labels[k],
  };
}
function chip(label, val){ if(!val) return ''; return `<span class="tagchip"><b>${label}</b><span class="val">${esc(val)}</span></span>`; }

function countAll(nodes, cb, path){
  (nodes||[]).forEach(n=>{ if(n.t==='f') cb(n, path||[]); else countAll(n.children, cb, (path||[]).concat([n.name])); });
}

function renderBoards(){
  const counts={};
  countAll(TREE,(n,p)=>{ const b=lbFor(n,p).board||'其他/待定'; counts[b]=(counts[b]||0)+1; });
  let html='<button class="boardbtn'+(currentBoard===''?' active':'')+'" data-b="">全部<span class="n"></span></button>';
  for(const b of BOARDS){
    if(counts[b]) html+=`<button class="boardbtn${currentBoard===b?' active':''}" data-b="${esc(b)}">${esc(b)}<span class="n">${counts[b]}</span></button>`;
  }
  $('boardbar').innerHTML=html;
  $('boardbar').querySelectorAll('.boardbtn').forEach(b=>{
    b.onclick=()=>{ currentBoard=b.dataset.b; render(); };
  });
}

function render(){
  renderBoards();
  const q=($('search').value||'').trim().toLowerCase();
  const filter=$('filter').value;
  const root=$('tree');
  root.innerHTML=buildTree(TREE,[]);
  let total=0,tagged=0;
  root.querySelectorAll('.file').forEach(el=>{
    const k=el.dataset.key, nm=el.dataset.name;
    const lb=getLbByKey(k);
    total++;
    if(lb.corrected) tagged++;
    const lbTxt=[lb.board,lb.theme,lb.tech,lb.org,lb.site,lb.phone].join(' ').toLowerCase();
    const hitB = !currentBoard || lb.board===currentBoard;
    const hitQ = !q || nm.toLowerCase().includes(q) || lbTxt.includes(q);
    const hitF = filter==='all' || (filter==='tagged'?lb.corrected:!lb.corrected);
    el.classList.toggle('hidden', !(hitB&&hitQ&&hitF));
  });
  $('stat').textContent=`共 ${total} 文件 · 已更正 ${tagged}`;
  root.querySelectorAll('details').forEach(d=>d.open=true);
  // 隐藏全空文件夹（仅当当前筛选中没有可见文件）
  root.querySelectorAll('details').forEach(d=>{
    const hid=[...d.querySelectorAll(':scope > div.file')].every(f=>f.classList.contains('hidden'));
    const subHid=[...d.querySelectorAll(':scope > details > summary')].length;
    if(hid && subHid===0 && !d.querySelector(':scope > div.file:not(.hidden)')) { /* nothing */ }
  });
}

function getLbByKey(k){
  let found={board:'',theme:'',tech:'',org:'',site:'',phone:'',note:'',corrected:false};
  countAll(TREE,(n,p)=>{ const lb=lbFor(n,p); if(lb.key===k) found=lb; });
  return found;
}
function buildTree(children, path){
  if(!children) return '';
  let html='';
  for(const node of children){
    if(node.t==='d'){
      const cnt=countFile(node);
      html+=`<details class="node${path.length?'':' top'}" open><summary><span class="fold">📁 ${esc(node.name)}</span><span class="cnt">(${cnt} 文件)</span></summary>${buildTree(node.children, path.concat([node.name]))}</details>`;
    } else {
      const lb=lbFor(node,path);
      const hasChip = lb.board||lb.theme||lb.tech||lb.org||lb.site||lb.phone||lb.note;
      const correctedMark = lb.corrected ? '<span class="tagchip" style="border-color:#4b7a4b;color:#9fe0a0">改</span>' : '';
      html+=`<div class="file" data-key="${esc(lb.key)}" data-name="${esc(node.name)}">
        <div class="row1">
          <span class="icon">${esc(node.icon||'')}</span>
          <span class="fname2">${esc(node.name)}</span>
          <span class="size">${esc(node.size||'')}</span>
          <button class="btn-edit${hasChip?' has-tag':''}" data-key="${esc(lb.key)}" title="编辑">${lb.corrected?'✓改':'✎编辑'}</button>
        </div>
        <div class="tags">${correctedMark}${chip('板块',lb.board)}${chip('主题',lb.theme)}${chip('技术点',lb.tech)}${chip('联系方',lb.org)}${chip('网站',lb.site)}${chip('电话',lb.phone)}${chip('备注',lb.note)}</div>
      </div>`;
    }
  }
  return html;
}
function countFile(node){ let c=0; (node.children||[]).forEach(n=>{ c+=n.t==='f'?1:countFile(n); }); return c; }

function $(id){return document.getElementById(id);}
const BOARD_SELECT='<option value="">(待定)</option>'+BOARDS.map(b=>`<option>${esc(b)}</option>`).join('');

function updateDatalists(board){
  const o = OPTIONS[board] || {theme:[], tech:[]};
  $('dlTheme').innerHTML = o.theme.map(t=>`<option value="${esc(t)}">`).join('');
  $('dlTech').innerHTML = o.tech.map(t=>`<option value="${esc(t)}">`).join('');
  $('fm-hint-opts').textContent = `可选池：主题 ${o.theme.length} 项 / 技术点 ${o.tech.length} 项（来自已填文件）。可用新值会自动加入。`;
}
function openModal(key){
  currentKey=key;
  const lb=getLbByKey(key);
  $('mPath').textContent=key;
  $('fBoard').innerHTML=BOARD_SELECT;
  $('fBoard').value=lb.board||'';
  $('fTheme').value=lb.theme||'';
  $('fTech').value=lb.tech||'';
  $('fOrg').value=lb.org||'';
  $('fSite').value=lb.site||'';
  $('fPhone').value=lb.phone||'';
  $('fNote').value=lb.note||'';
  updateDatalists(lb.board||'');
  $('mask').classList.add('show');
}
function closeModal(){ $('mask').classList.remove('show'); currentKey=null; }

$('btnSave').onclick=()=>{
  const lb={ board:$('fBoard').value, theme:$('fTheme').value.trim(), tech:$('fTech').value.trim(), org:$('fOrg').value.trim(), site:$('fSite').value.trim(), phone:$('fPhone').value.trim(), note:$('fNote').value.trim() };
  // 新值并入选项池，便于后续直接选取
  if(lb.board){
    const o=OPTIONS[lb.board] || (OPTIONS[lb.board]={theme:[],tech:[]});
    if(lb.theme && !o.theme.includes(lb.theme)) o.theme.push(lb.theme);
    (lb.tech.split(/[，,]/)).forEach(t=>{ t=t.trim(); if(t && !o.tech.includes(t)) o.tech.push(t); });
    o.theme.sort(); o.tech.sort();
  }
  if(lb.board||lb.theme||lb.tech||lb.org||lb.site||lb.phone||lb.note) labels[currentKey]=lb; else delete labels[currentKey];
  save(); closeModal(); render();
};
$('btnDelTag').onclick=()=>{ if(confirm('清除此文件自定义标签（恢复预设板块）？')){ delete labels[currentKey]; save(); closeModal(); render(); } };
$('btnCancel').onclick=closeModal;
$('fBoard').addEventListener('change',()=>{ updateDatalists($('fBoard').value); });
$('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeModal(); });
$('search').addEventListener('input',render);
$('filter').addEventListener('change',render);
$('tree').addEventListener('click',e=>{ const b=e.target.closest('.btn-edit'); if(b) openModal(b.dataset.key); });

// ---- 导出：合并预设 + 用户编辑，生成每个文件的最终标签 ----
function exportLabels(){
  const out=[];
  countAll(TREE,(n,p)=>{
    const lb=lbFor(n,p);
    out.push({ file: n.name, path:p, board:lb.board, theme:lb.theme, tech:lb.tech,
               org:lb.org, site:lb.site, phone:lb.phone, note:lb.note });
  });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='chassis_labels.json';
  a.click();
  URL.revokeObjectURL(a.href);
  alert('已导出 '+out.length+' 条标签到 chassis_labels.json。请把该文件保存后交给 AI 入库。');
}
$('btnExport').onclick=exportLabels;

load(); render();
