version: '3.8'
# NebulaGraph 集群 + Studio 可视化（独立于本机运行的 backend/frontend）
# 启动:  docker compose -f docker-compose.nebula.yml up -d
# 说明: 容器间通过 nebula-net 网络互通，graphd 对宿主机开放 9669 端口，
#       本机 backend（venv）设置 KNOWLEDGE_ENGINE=nebula + NEBULA_HOST=127.0.0.1 即可连接。
services:
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: nebula-metad
    environment:
      USER: root
      # 集群节点地址（容器名）, 供其他组件发现
      meta_server_addrs: "nebula-metad:9559"
      local_ip: "nebula-metad"
    ports:
      - "9559:9559"
      - "9560:9560"
      - "9561:9561"
    networks:
      - nebula-net
    volumes:
      - meta-data:/usr/local/nebula/data

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: nebula-storaged
    environment:
      USER: root
      meta_server_addrs: "nebula-metad:9559"
      local_ip: "nebula-storaged"
    ports:
      - "9777:9777"
      - "9778:9778"
      - "9779:9779"
    networks:
      - nebula-net
    volumes:
      - store-data:/usr/local/nebula/data
    depends_on:
      - nebula-metad

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: nebula-graphd
    environment:
      USER: root
      meta_server_addrs: "nebula-metad:9559"
    ports:
      - "9669:9669"
      - "19669:19669"
    networks:
      - nebula-net
    depends_on:
      - nebula-metad
      - nebula-storaged

  nebula-studio:
    image: vesoft/nebula-studio:v3.8.0
    container_name: nebula-studio
    ports:
      - "7001:7001"
    networks:
      - nebula-net
    depends_on:
      - nebula-graphd

networks:
  nebula-net:
    driver: bridge

volumes:
  meta-data:
  store-data:
